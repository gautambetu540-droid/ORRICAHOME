<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Open Roles | Orrica Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="site.css"/>
<style>
:root{--ink:#10223d;--deep:#07172c;--muted:#66758b;--line:#e3e9f0;--soft:#f6f8fb;--hero:#f2f6fc;--orange:#ff6b22;--orange-dark:#e65316;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}.grain{pointer-events:none}
.sub-nav{height:76px;position:sticky;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:0 clamp(20px,4vw,64px);background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:inline-flex;align-items:center;width:max-content}.brand img{display:block;width:158px;height:auto}.sub-nav nav{display:flex;gap:34px;align-items:center}.sub-nav nav a{color:#68778d;text-decoration:none;font-size:14px;font-weight:700}.sub-nav nav a.active{color:var(--orange)}.header-actions{justify-self:end;display:flex;align-items:center;gap:10px}.header-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:800}.header-btn.secondary{border:1px solid var(--line);color:var(--ink);background:#fff}.header-btn.primary{background:var(--orange);color:#fff;box-shadow:0 8px 22px rgba(255,107,34,.18)}
.jobs-hero{background:linear-gradient(135deg,#07172c 0%,#102d50 100%);color:#fff}.jobs-hero-inner{max-width:1200px;margin:auto;padding:72px 24px 76px}.eyebrow{font:500 10px/1.2 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}.jobs-hero h1{font-size:clamp(44px,6vw,72px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 18px;max-width:760px}.jobs-hero h1 em{font-style:normal;color:#c7d8ea}.jobs-hero p{max-width:670px;color:#aebfd3;font-size:16px;line-height:1.75;margin:0}.hero-stat{display:inline-flex;align-items:baseline;gap:10px;margin-top:30px}.hero-stat strong{font-size:32px;line-height:1;font-weight:800}.hero-stat span{font:500 10px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9eb1c7}
.roles{max-width:1200px;margin:auto;padding:64px 24px 96px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:64px}.filters{position:sticky;top:100px;height:max-content}.filters .eyebrow{margin:0 0 10px}.filter-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.filter-title h2{font-size:25px;letter-spacing:-.04em;margin:0 0 28px}.filter-badge{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff0e9;color:var(--orange-dark);font-size:11px;font-weight:800;margin-top:-28px}.filter-label{display:block;margin:0 0 16px;color:#56667c;font-size:11px;font-weight:800}.filter-label input,.filter-label select{display:block;width:100%;height:46px;margin-top:7px;padding:0 13px;border:1px solid #dce3eb;border-radius:12px;background:#fff;color:var(--ink);font:500 13px Manrope;outline:none}.filter-label input:focus,.filter-label select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,34,.1)}.reset{border:0;background:none;padding:6px 0;color:var(--orange-dark);font:800 12px Manrope;cursor:pointer}.roles-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;color:#77869a}.roles-head span:first-child{color:var(--ink);font-size:14px}.job-list{display:grid;gap:14px}.job-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:26px 26px 24px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 26px rgba(16,34,61,.045);transition:transform .2s,box-shadow .2s,border-color .2s}.job-card:hover{transform:translateY(-2px);border-color:#d2dce8;box-shadow:0 16px 36px rgba(16,34,61,.08)}.job-team{display:inline-block;margin-bottom:9px;color:var(--orange-dark);font:500 10px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase}.job-card h3{font-size:22px;line-height:1.25;letter-spacing:-.035em;margin:0 0 9px}.job-summary{margin:0;max-width:720px;color:var(--muted);font-size:14px;line-height:1.65}.job-meta{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:16px;color:#627289;font-size:12px;font-weight:700}.meta-item{display:inline-flex;align-items:center;gap:6px}.icon{width:15px;height:15px;display:block;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.job-actions{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:flex-end}.job-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border-radius:11px;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}.view-btn{border:1px solid #dce3eb;color:#46566d;background:#fff}.apply-btn{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(255,107,34,.17)}.apply-btn:hover{background:var(--orange-dark)}.empty{padding:48px 24px;border:1px dashed #d8e0e9;border-radius:18px;text-align:center;color:#75849a;font-size:14px}
@media(max-width:900px){.sub-nav{height:68px;grid-template-columns:1fr auto;padding:0 20px}.sub-nav nav{display:none}.brand img{width:126px}.header-actions .secondary{display:none}.header-btn{min-height:42px;padding:0 15px;font-size:12px}.jobs-hero-inner{padding:52px 20px 56px}.jobs-hero h1{font-size:44px}.jobs-hero p{font-size:15px}.roles{grid-template-columns:1fr;gap:32px;padding:42px 20px 80px}.filters{position:static}.filter-title h2{margin-bottom:20px}.filters-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filter-label{margin:0}.filter-label:first-child{grid-column:1/-1}.reset{margin-top:5px}.job-card{grid-template-columns:1fr;gap:18px;padding:22px 20px}.job-card h3{font-size:21px}.job-actions{justify-content:stretch}.job-actions a{flex:1;min-height:46px}.roles-head{margin-top:4px}}
@media(max-width:520px){.sub-nav{padding:0 16px}.brand img{width:116px}.header-btn.primary{min-height:40px;padding:0 13px}.jobs-hero-inner{padding:42px 18px 48px}.jobs-hero h1{font-size:38px}.jobs-hero p{font-size:14px;line-height:1.7}.hero-stat{margin-top:24px}.hero-stat strong{font-size:28px}.roles{padding:34px 16px 72px}.filters-form{grid-template-columns:1fr}.filter-label:first-child{grid-column:auto}.job-card{padding:20px 18px;border-radius:18px}.job-team{font-size:9px}.job-card h3{font-size:20px}.job-summary{font-size:13.5px}.job-meta{font-size:11.5px;gap:8px 14px}.job-actions a{font-size:12px}}
</style>
</head>
<body>
<div class="grain"></div>
<header class="sub-nav">
  <a href="/" class="brand"><img src="assets/orrica-edge-logo.png" alt="Orrica Edge"/></a>
  <nav><a href="/">Home</a><a href="/jobs" class="active">Open roles</a></nav>
  <div class="header-actions"><a class="header-btn secondary" href="/admin/login">Workspace Login</a><a class="header-btn primary" href="#roles">View all roles <span aria-hidden="true">↗</span></a></div>
</header>
<main>
<section class="jobs-hero"><div class="jobs-hero-inner"><div class="eyebrow">Build your next chapter</div><h1>Work that <em>moves you</em> forward.</h1><p>Find an opportunity with ambitious teams across customer experience, banking, sales, operations and technology.</p><div class="hero-stat"><strong id="role-count">—</strong><span>live opportunities</span></div></div></section>
<section class="roles" id="roles">
<aside class="filters"><div class="eyebrow">Explore roles</div><div class="filter-title"><h2>Find the right fit.</h2><span class="filter-badge" id="filterCount">0</span></div><div class="filters-form"><label class="filter-label">Search<input id="search" placeholder="Job title or keyword" autocomplete="off"/></label><label class="filter-label">Location<select id="location"><option value="">All locations</option></select></label><label class="filter-label">Function<select id="team"><option value="">All functions</option></select></label></div><button id="reset" class="reset" type="button">Reset filters</button></aside>
<div><div class="roles-head"><span id="results">Open roles</span><span>Updated daily</span></div><div class="job-list" id="job-list"></div></div>
</section></main>
<div id="site-footer"></div><script src="footer.js"></script><script src="jobs.js"></script>
</body></html>
