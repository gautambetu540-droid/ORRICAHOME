<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Post a role | Orrica Edge</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="site.css"/></head><body class="admin-body"><div class="grain"></div><main class="admin"><a href="index.html" class="brand"><img src="assets/orrica-edge-logo.png" alt="Orrica Edge"/></a><div class="admin-grid"><section><div class="eyebrow">Recruiter portal</div><h1>Post an opportunity that stands out.</h1><p>Publish a role and it will immediately appear on the homepage and in Open Roles.</p><div class="admin-note">This local demo uses a JSON data store. Before a public launch, protect this route with recruiter authentication and move the jobs store to a managed database.</div></section><form id="job-form"><label>Role title<input name="title" required placeholder="e.g. Customer Support Executive"/></label><div class="form-row"><label>Function<input name="team" required placeholder="e.g. Customer Experience"/></label><label>Location<input name="location" required placeholder="e.g. Gurugram, India"/></label></div><div class="form-row"><label>Employment type<select name="type"><option>Full-time</option><option>Part-time</option><option>Contract</option></select></label><label>Experience<input name="experience" required placeholder="e.g. 1-3 years"/></label></div><label>Short introduction<textarea name="summary" required placeholder="One compelling line for candidates."></textarea></label><label>Role description<textarea name="description" required placeholder="Describe impact, responsibilities, and the candidate experience."></textarea></label><label>Key skills <small>comma-separated</small><input name="skills" required placeholder="Communication, Customer empathy, CRM"/></label><button class="button orange" type="submit">Publish open role →</button><p id="form-status"></p></form></div></main><script src="admin.js"></script></body></html>
