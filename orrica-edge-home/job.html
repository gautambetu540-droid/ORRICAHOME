<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Role | Orrica Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="site.css"/><link rel="stylesheet" href="/header-fix.css"/>
<style>
/* ==========================================================
   TOKENS
   ========================================================== */
:root{
  --navy:#10223D;
  --navy-deep:#07172C;
  --orange:#FF6B22;
  --orange-dark:#e6591a;
  --orange-glow:rgba(255,107,34,.22);
  --body:#5F7087;
  --bg-light:#F7F9FC;
  --hero-bg:#F2F6FC;
  --line:#E1E8F0;
  --white:#FFFFFF;
  --green:#e8f8f0;
  --shadow-soft:0 20px 44px -20px rgba(16,34,61,.16);
  --shadow-navy:0 24px 60px -18px rgba(7,23,44,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--navy);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
::selection{background:var(--orange-glow);color:var(--navy-deep)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(255,107,34,.5)}50%{box-shadow:0 0 0 5px rgba(255,107,34,0)}}

/* ==========================================================
   HEADER
   ========================================================== */
.sub-nav{
  position:sticky;top:0;z-index:50;
  height:76px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  max-width:1200px;margin:0 auto;
  padding:0 28px;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.brand{display:inline-flex;align-items:center;width:max-content}
.brand img{display:block;width:156px;height:auto;max-width:100%}
.sub-nav nav{display:flex;gap:34px;align-items:center;justify-self:center}
.sub-nav nav a{position:relative;color:#68778d;text-decoration:none;font-size:14px;font-weight:700;padding:4px 0}
.sub-nav nav a:after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--orange);transform:scaleX(0);transition:transform .18s ease}
.sub-nav nav a:hover:after{transform:scaleX(1)}
.sub-nav nav a.active{color:var(--orange)}
.sub-nav nav a.active:after{transform:scaleX(1)}
.header-role-btn{
  justify-self:end;display:inline-flex;align-items:center;gap:7px;
  height:42px;padding:0 18px;border-radius:999px;
  background:var(--orange);color:#fff;text-decoration:none;
  font-size:13px;font-weight:800;white-space:nowrap;
  box-shadow:0 8px 20px rgba(255,107,34,.22);
  transition:background .15s ease,transform .15s ease,box-shadow .15s ease;
}
.header-role-btn:hover{background:var(--orange-dark);transform:translateY(-1px);box-shadow:0 12px 26px rgba(255,107,34,.3)}
.header-role-btn span{transition:transform .15s ease}
.header-role-btn:hover span{transform:translate(2px,-2px)}

/* ==========================================================
   PAGE SHELL
   ========================================================== */
.job-shell{max-width:1200px;margin:0 auto;padding:0 24px 120px}

/* ==========================================================
   BREADCRUMB
   ========================================================== */
.job-breadcrumb{
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  margin:24px 0 0;
  color:#718097;font-size:13px;font-weight:700;
  overflow:hidden;
}
.job-breadcrumb a{text-decoration:none;color:inherit;flex:0 0 auto;transition:color .15s ease}
.job-breadcrumb a:hover{color:var(--navy)}
.job-breadcrumb span{flex:0 0 auto}
.job-breadcrumb span:last-child{
  color:var(--orange-dark);font-weight:800;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ==========================================================
   HERO
   ========================================================== */
.job-hero{
  margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;
  animation:riseIn .5s cubic-bezier(.2,.7,.2,1) both;
}
.hero-main{
  position:relative;overflow:hidden;
  padding:52px 56px;border:1px solid var(--line);border-radius:24px;
  background:
    radial-gradient(circle at 82% -10%, rgba(255,107,34,.10), transparent 42%),
    radial-gradient(1px 1px at 0 0, rgba(16,34,61,.10) 1px, transparent 0) 0 0/22px 22px,
    var(--hero-bg);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 12px 5px 10px;border-radius:999px;
  background:rgba(255,107,34,.09);border:1px solid rgba(255,107,34,.28);
  font:500 11px/1.2 'DM Mono',monospace;letter-spacing:.13em;color:var(--orange-dark);
}
.eyebrow:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulseDot 2s ease-in-out infinite}
.hero-main h1{
  font-size:clamp(40px,4.5vw,60px);font-weight:800;line-height:1.02;
  letter-spacing:-0.045em;margin:18px 0 24px;max-width:19ch;color:var(--navy);
  text-wrap:balance;
}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px}
.hero-meta span{
  display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:0 13px;border:1px solid var(--line);
  background:#fff;border-radius:999px;color:#3d4d64;font-size:13px;font-weight:700;
  box-shadow:0 1px 0 rgba(16,34,61,.02);
}
.hero-meta span .icon{color:var(--orange)}
.icon{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Apply CTA — desktop card */
.hero-side{
  position:relative;overflow:hidden;
  padding:30px 28px;border-radius:24px;background:var(--navy-deep);color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:var(--shadow-navy);
}
.hero-side:before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120px 120px at 100% 0%, rgba(255,107,34,.35), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 26px);
  pointer-events:none;
}
.hero-side>*{position:relative}
.hero-side .label{font:500 10px 'DM Mono',monospace;letter-spacing:.14em;color:#9dafc5}
.hero-side h3{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.02em;margin:10px 0 12px}
.hero-side p{color:#c1cddd;font-size:14px;line-height:1.65;margin:0 0 22px}
.apply-btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:52px;border:0;border-radius:14px;
  background:var(--orange);color:#fff;font:800 15px Manrope;cursor:pointer;
  box-shadow:0 12px 26px rgba(255,107,34,.32);transition:background .15s ease,transform .15s ease,box-shadow .15s ease;
}
.apply-btn:after{
  content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);transition:left .5s ease;
}
.apply-btn:hover:after{left:130%}
.apply-btn:hover{background:var(--orange-dark);transform:translateY(-2px);box-shadow:0 16px 32px rgba(255,107,34,.4)}
.apply-btn:active{transform:translateY(0) scale(.98)}

/* ==========================================================
   MAIN CONTENT — two column
   ========================================================== */
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;margin-top:64px}
.content article{max-width:760px}
.content h2{
  position:relative;padding-left:16px;
  font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.03em;margin:0 0 18px;color:var(--navy);
  text-wrap:balance;
}
.content h2:before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:4px;background:var(--orange)}
.content h2:not(:first-child){margin-top:48px}
.rich-job-content{font-size:16px;font-weight:500;line-height:1.75;color:var(--body)}
.rich-job-content p{margin:0 0 15px}
.rich-job-content h2,.rich-job-content h3{color:var(--navy);margin:32px 0 10px;font-weight:800;line-height:1.3}
.rich-job-content h3{font-size:20px}
.rich-job-content ul,.rich-job-content ol{margin:12px 0 20px;padding-left:22px}
.rich-job-content li{margin:11px 0}
.rich-job-content strong{font-weight:800;color:#34445a}

.content-list{margin:0;padding:0;list-style:none}
.content-list li{
  position:relative;padding:13px 0 13px 32px;color:var(--body);
  font-size:16px;font-weight:500;line-height:1.75;border-bottom:1px solid var(--line);
}
.content-list li:before{
  content:'';position:absolute;left:0;top:14px;width:18px;height:18px;border-radius:50%;
  background:rgba(255,107,34,.12);border:1px solid rgba(255,107,34,.35);
}
.content-list li:after{
  content:'';position:absolute;left:5.5px;top:19px;width:7px;height:4px;
  border-left:2px solid var(--orange);border-bottom:2px solid var(--orange);transform:rotate(-45deg);
}

/* Skill tags */
.skill-tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.skill-tags span{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-light);color:#46566d;font-size:13px;font-weight:700;
  transition:border-color .15s ease,color .15s ease,transform .15s ease;
}
.skill-tags span:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--orange)}
.skill-tags span:hover{border-color:var(--orange);color:var(--navy);transform:translateY(-1px)}

/* ==========================================================
   SIDEBAR — Job overview
   ========================================================== */
.job-sidebar{position:sticky;top:96px;height:max-content}
.info-card{
  position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:18px;padding:24px;background:#fff;
  box-shadow:var(--shadow-soft);
}
.info-card:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),transparent 85%)}
.info-card h3{margin:0 0 14px;font-size:18px;font-weight:800;color:var(--navy)}
.info-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.info-row:last-child{border-bottom:0}
.info-row span:first-child{color:#8491a4;font-size:12px;font-weight:700;letter-spacing:.02em}
.info-row span:last-child{text-align:right;font-size:14px;font-weight:800;color:var(--navy)}

/* ==========================================================
   MOBILE APPLY BAR
   ========================================================== */
.mobile-apply{display:none}

/* ==========================================================
   MISC / MODAL (application form — logic untouched)
   ========================================================== */
.not-found{max-width:900px;margin:90px auto;padding:60px 24px;text-align:center}
.mini-footer{padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#8290a3;font-size:12px}
.mini-footer a{text-decoration:none;transition:color .15s ease}
.mini-footer a:hover{color:var(--orange-dark)}

.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,18,35,.6);backdrop-filter:blur(8px)}
.modal.open{display:flex}
.modal-card{
  width:min(720px,100%);max-height:min(90vh,850px);overflow:auto;border-radius:22px;background:#fff;
  box-shadow:0 30px 80px rgba(0,0,0,.28);animation:riseIn .28s ease both;
}
.modal-card::-webkit-scrollbar{width:8px}
.modal-card::-webkit-scrollbar-thumb{background:#d8e0ea;border-radius:8px}
.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(10px)}
.modal-head h2{margin:0;font-size:22px;letter-spacing:-.03em;font-weight:800}
.close{border:0;background:#f1f4f8;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:#52627a;transition:background .15s ease,color .15s ease}
.close:hover{background:#fde8dc;color:var(--orange-dark)}
.form{padding:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:#46566d}
.field input,.field textarea,.field select{width:100%;height:48px;border:1px solid #dbe2eb;border-radius:12px;background:#fff;padding:0 14px;font:500 14px Manrope;color:var(--navy);outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.field textarea{height:auto;min-height:112px;padding:13px 14px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,34,.1)}
.form-note{padding:12px 14px;border-radius:12px;background:var(--bg-light);color:#738198;font-size:12px;line-height:1.6}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.secondary{border:1px solid #dce3ec;background:#fff;color:#46566d;border-radius:12px;padding:12px 18px;font:800 13px Manrope;cursor:pointer;transition:background .15s ease}
.secondary:hover{background:#f4f6f9}
.success{padding:42px 26px;text-align:center}
.success .check{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;border-radius:50%;background:var(--green);color:#148653;font-size:28px}
.success h3{margin:0 0 8px;font-size:25px;font-weight:800}
.success p{color:#738198;line-height:1.7;margin:0}

/* ==========================================================
   RESPONSIVE — Tablet (768–1023)
   ========================================================== */
@media(max-width:1023px){
  .job-hero{grid-template-columns:1fr}
  .hero-side{display:none}
  .detail-layout{grid-template-columns:1fr}
  .job-sidebar{position:static;order:3}
  .content article{max-width:none}
}

/* ==========================================================
   RESPONSIVE — Mobile (<=767)
   ========================================================== */
@media(max-width:767px){
  .sub-nav{height:64px;grid-template-columns:1fr auto;padding:0 16px}
  .sub-nav nav{display:none}
  .brand img{width:112px}
  .header-role-btn{height:40px;padding:0 14px;font-size:12px}

  .job-shell{padding:0 16px 128px}

  .job-breadcrumb{margin-top:16px;font-size:12px}

  .job-hero{margin-top:16px}
  .hero-main{padding:28px 22px;border-radius:22px}
  .hero-main h1{font-size:33px;line-height:1.06;letter-spacing:-0.04em;margin:14px 0 18px;max-width:none}
  .hero-meta{gap:8px}
  .hero-meta span{min-height:auto;padding:8px 11px;font-size:13px}

  .detail-layout{margin-top:40px;gap:0}
  .content h2{font-size:24px}
  .content h2:not(:first-child){margin-top:40px}
  .rich-job-content,.content-list li{font-size:15.5px;line-height:1.75}

  .job-sidebar{margin-top:40px}
  .info-card{width:auto}

  .mobile-apply{
    display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;
    padding:6px;border:1px solid #d5dde7;border-radius:18px;height:68px;
    background:rgba(255,255,255,.97);box-shadow:0 16px 40px rgba(16,34,61,.2);
    backdrop-filter:blur(12px);
  }
  .mobile-apply:before{
    content:'';position:fixed;left:0;right:0;bottom:88px;height:28px;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.9));
    pointer-events:none;z-index:59;
  }
  .mobile-apply .apply-btn{height:54px;border-radius:14px}

  .mini-footer{display:block;padding-bottom:96px}
  .mini-footer a{display:block;margin-top:8px}

  .modal{padding:0;align-items:flex-end}
  .modal-card{width:100%;max-height:94vh;border-radius:22px 22px 0 0;animation:none}
  .modal-head{padding:18px}
  .form{padding:18px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .form-actions{flex-direction:column-reverse}
  .form-actions button{width:100%}
}

/* ==========================================================
   RESPONSIVE — small mobile (<=430)
   ========================================================== */
@media(max-width:430px){
  .sub-nav{padding:0 16px}
  .brand img{width:110px}
  .header-role-btn{padding:0 12px}
  .hero-main{padding:26px 18px}
  .hero-main h1{font-size:32px}
}
</style></head>
<body>
<div class="grain"></div>
<header class="sub-nav"><a href="/" class="brand"><img src="assets/orrica-edge-logo.png" alt="Orrica Edge"/></a><nav><a href="/">Home</a><a href="/jobs" class="active">Open roles</a></nav><a class="header-role-btn" href="/jobs">All open roles <span aria-hidden="true">↗</span></a></header>
<main id="job"></main>
<div class="mobile-apply" id="mobileApply" hidden><button class="apply-btn" id="mobileApplyBtn">Apply for this role <span aria-hidden="true">→</span></button></div>
<footer class="mini-footer"><span>© 2026 Orrica Edge</span><a href="/jobs">See all open roles →</a></footer>
<div class="modal" id="applyModal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="applyTitle"><div class="modal-head"><div><div class="eyebrow">Orrica Edge · Application</div><h2 id="applyTitle">Apply for this role</h2></div><button class="close" id="closeApply" aria-label="Close">×</button></div><div id="applyBody"></div></div></div>
<script src="job.js"></script></body></html>
