<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Role | Orrica Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="site.css"/>
<style>
:root{--ink:#10223d;--muted:#66758b;--line:#e7ebf1;--soft:#f6f8fb;--orange:#ff6b22;--orange2:#f4511e;--green:#e8f8f0;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,Arial,sans-serif}.grain{pointer-events:none}
.sub-nav{position:sticky;top:0;z-index:50;height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(18px,4vw,64px);gap:28px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.sub-nav .brand{display:flex;align-items:center;width:max-content}.sub-nav .brand img{width:148px;height:auto;object-fit:contain;filter:none}.sub-nav nav{display:flex;align-items:center;justify-content:center;gap:34px}.sub-nav nav a{color:#68778d;text-decoration:none;font-weight:700;font-size:14px}.sub-nav nav a.active{color:var(--orange)}.sub-nav>.button{justify-self:end;text-decoration:none;padding:13px 19px;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(255,107,34,.18)}
.job-shell{max-width:1220px;margin:0 auto;padding:30px 24px 110px}.job-breadcrumb{display:flex;align-items:center;gap:9px;margin:4px 0 22px;color:#718097;font-size:13px;font-weight:700}.job-breadcrumb a{color:inherit;text-decoration:none}.job-breadcrumb span:last-child{color:var(--orange)}
.job-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);gap:28px;align-items:stretch}.hero-main{padding:42px clamp(26px,5vw,62px);border-radius:28px;background:linear-gradient(135deg,#f4f8ff,#eef4fb);border:1px solid #e5ebf3}.eyebrow{font:500 11px/1 DM Mono,monospace;text-transform:uppercase;letter-spacing:.18em;color:var(--orange)}.hero-main h1{font-size:clamp(36px,5vw,68px);line-height:1.03;letter-spacing:-.055em;margin:18px 0 26px;max-width:850px}.hero-meta{display:flex;flex-wrap:wrap;gap:10px}.hero-meta span{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid #dce4ee;background:#fff;border-radius:999px;color:#52627a;font-size:13px;font-weight:700}.hero-side{padding:30px;border-radius:28px;background:#10223d;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:100%}.hero-side .label{font:500 10px DM Mono,monospace;text-transform:uppercase;letter-spacing:.16em;color:#9dafc5}.hero-side h3{font-size:28px;line-height:1.1;letter-spacing:-.035em;margin:10px 0}.hero-side p{color:#c1cddd;font-size:14px;line-height:1.7;margin:0 0 24px}.apply-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(255,107,34,.24)}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:70px;padding:70px 14px}.content article{max-width:780px}.content h2{font-size:27px;letter-spacing:-.035em;margin:0 0 20px;padding-top:8px}.content h2:not(:first-child){margin-top:54px}.rich-job-content{font-size:16px;line-height:1.85;color:#66758b}.rich-job-content p{margin:0 0 18px}.rich-job-content h2,.rich-job-content h3{color:var(--ink);margin:28px 0 10px;font-weight:800;line-height:1.3}.rich-job-content ul,.rich-job-content ol{margin:12px 0 20px;padding-left:23px}.rich-job-content li{margin:9px 0}.rich-job-content strong{font-weight:800;color:#34445a}.rich-job-content a{text-decoration:underline}.content-list{margin:0;padding:0;list-style:none}.content-list li{position:relative;padding:14px 0 14px 28px;color:#66758b;font-size:16px;line-height:1.7;border-bottom:1px solid var(--line)}.content-list li:before{content:'✓';position:absolute;left:0;top:14px;color:var(--orange);font-weight:900}.job-sidebar{position:sticky;top:102px;height:max-content}.info-card{border:1px solid var(--line);border-radius:20px;padding:24px;background:#fff;box-shadow:0 16px 40px rgba(16,34,61,.06)}.info-card h3{margin:0 0 18px;font-size:18px}.info-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.info-row:last-child{border-bottom:0}.info-row span:first-child{color:#8491a4}.info-row span:last-child{text-align:right;font-weight:800;color:#263954}.not-found{max-width:900px;margin:100px auto;padding:60px 24px;text-align:center}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,18,35,.58);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(720px,100%);max-height:min(90vh,850px);overflow:auto;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:20px;padding:24px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}.modal-head h2{margin:0;font-size:23px;letter-spacing:-.035em}.close{border:0;background:#f1f4f8;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:#52627a}.form{padding:26px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#46566d}.field input,.field textarea,.field select{width:100%;border:1px solid #dbe2eb;border-radius:12px;background:#fff;padding:13px 14px;font:500 14px Manrope,Arial;color:var(--ink);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,34,.1)}.form-note{padding:12px 14px;border-radius:12px;background:var(--soft);color:#738198;font-size:12px;line-height:1.6}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary{border:1px solid #dce3ec;background:#fff;color:#46566d;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.success{padding:40px 26px;text-align:center}.success .check{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;border-radius:50%;background:var(--green);color:#148653;font-size:28px}.success h3{margin:0 0 8px;font-size:25px}.success p{color:#738198;line-height:1.7;margin:0}
.mobile-apply{display:none}.mini-footer{padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#8290a3;font-size:12px}.mini-footer a{color:inherit}
@media(max-width:900px){.sub-nav{height:64px;grid-template-columns:1fr auto;gap:12px;padding:0 16px}.sub-nav .brand img{width:112px}.sub-nav nav{display:none}.sub-nav>.button{padding:10px 14px;font-size:12px}.job-shell{padding:18px 14px 100px}.job-breadcrumb{margin:3px 4px 15px;font-size:12px;white-space:nowrap;overflow:hidden}.job-hero{grid-template-columns:1fr;gap:12px}.hero-main{padding:30px 22px;border-radius:22px}.hero-main h1{font-size:40px;margin:15px 0 20px}.hero-side{display:none}.detail-layout{display:block;padding:42px 4px 28px}.content article{max-width:none}.content h2{font-size:24px;margin-bottom:16px}.content h2:not(:first-child){margin-top:42px}.rich-job-content,.content-list li{font-size:15px;line-height:1.78}.job-sidebar{display:none}.mobile-apply{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;padding:8px;border:1px solid #cfd7e2;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 18px 50px rgba(16,34,61,.18);backdrop-filter:blur(12px)}.mobile-apply .apply-btn{min-height:52px}.mini-footer{padding-bottom:88px;display:block}.mini-footer a{display:block;margin-top:8px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:10px;align-items:flex-end}.modal-card{max-height:94vh;border-radius:22px 22px 0 0}.modal-head{padding:18px 18px}.form{padding:18px}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}}
@media(min-width:901px){body{min-width:320px}}
</style>
</head>
<body>
<div class="grain"></div>
<header class="sub-nav">
  <a href="/" class="brand"><img src="assets/orrica-edge-logo.png" alt="Orrica Edge"/></a>
  <nav><a href="/">Home</a><a href="/jobs" class="active">Open roles</a></nav>
  <a class="button" href="/jobs">All open roles ↗</a>
</header>
<main id="job"></main>
<div class="mobile-apply" id="mobileApply" hidden><button class="apply-btn" id="mobileApplyBtn">Apply for this role</button></div>
<footer class="mini-footer"><span>© 2026 Orrica Edge</span><a href="/jobs">See all open roles →</a></footer>
<div class="modal" id="applyModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="applyTitle">
    <div class="modal-head"><div><div class="eyebrow">Orrica Edge · Application</div><h2 id="applyTitle">Apply for this role</h2></div><button class="close" id="closeApply" aria-label="Close">×</button></div>
    <div id="applyBody"></div>
  </div>
</div>
<script src="job.js"></script>
</body>
</html>
