<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Role | Orrica Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="site.css"/>
<style>
:root{--ink:#10223d;--deep:#07172c;--muted:#66758b;--line:#e3e9f0;--soft:#f6f8fb;--hero:#f2f6fc;--orange:#ff6b22;--orange-dark:#e65316;--green:#e8f8f0;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}.grain{pointer-events:none}
.sub-nav{position:sticky;top:0;z-index:50;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,4vw,64px);gap:24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{display:inline-flex;align-items:center;width:max-content}.brand img{display:block;width:158px;height:auto}.sub-nav nav{display:flex;gap:34px;align-items:center}.sub-nav nav a{color:#68778d;text-decoration:none;font-size:14px;font-weight:700}.sub-nav nav a.active{color:var(--orange)}.header-role-btn{justify-self:end;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;background:var(--orange);color:#fff;text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 8px 22px rgba(255,107,34,.18)}
.job-shell{max-width:1200px;margin:0 auto;padding:28px 24px 120px}.job-breadcrumb{display:flex;align-items:center;gap:8px;margin:0 0 22px;color:#718097;font-size:13px;font-weight:700}.job-breadcrumb a{color:inherit;text-decoration:none}.job-breadcrumb span:last-child{color:var(--orange-dark)}
.job-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.72fr);gap:24px}.hero-main{padding:48px 56px;border:1px solid #e0e8f2;border-radius:24px;background:linear-gradient(135deg,#f5f8fd,#eef4fb)}.eyebrow{font:500 10px/1.2 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}.hero-main h1{font-size:clamp(42px,5vw,62px);line-height:1.03;letter-spacing:-.055em;margin:17px 0 24px;max-width:800px}.hero-meta{display:flex;flex-wrap:wrap;gap:8px}.hero-meta span{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border:1px solid #d9e2ec;background:#fff;border-radius:999px;color:#52627a;font-size:12px;font-weight:700}.icon{width:15px;height:15px;display:block;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero-side{padding:30px;border-radius:24px;background:var(--deep);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:100%}.hero-side .label{font:500 10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.16em;color:#9dafc5}.hero-side h3{font-size:28px;line-height:1.1;letter-spacing:-.035em;margin:10px 0}.hero-side p{color:#c1cddd;font-size:14px;line-height:1.7;margin:0 0 24px}.apply-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:13px;background:var(--orange);color:#fff;font:800 15px Manrope;cursor:pointer;box-shadow:0 10px 24px rgba(255,107,34,.2);transition:.2s}.apply-btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;padding:64px 10px}.content article{max-width:760px}.content h2{font-size:28px;line-height:1.2;letter-spacing:-.04em;margin:0 0 18px}.content h2:not(:first-child){margin-top:50px}.rich-job-content{font-size:16px;line-height:1.8;color:var(--muted)}.rich-job-content p{margin:0 0 16px}.rich-job-content h2,.rich-job-content h3{color:var(--ink);margin:28px 0 10px;font-weight:800;line-height:1.3}.rich-job-content ul,.rich-job-content ol{margin:12px 0 20px;padding-left:23px}.rich-job-content li{margin:8px 0}.rich-job-content strong{font-weight:800;color:#34445a}.content-list{margin:0;padding:0;list-style:none}.content-list li{position:relative;padding:13px 0 13px 26px;color:var(--muted);font-size:16px;line-height:1.7;border-bottom:1px solid var(--line)}.content-list li:before{content:'✓';position:absolute;left:0;top:13px;color:var(--orange);font-weight:900}.job-sidebar{position:sticky;top:100px;height:max-content}.info-card{border:1px solid var(--line);border-radius:18px;padding:24px;background:#fff;box-shadow:0 14px 34px rgba(16,34,61,.055)}.info-card h3{margin:0 0 16px;font-size:18px}.info-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.info-row:last-child{border-bottom:0}.info-row span:first-child{color:#8491a4}.info-row span:last-child{text-align:right;font-weight:800;color:#263954}.not-found{max-width:900px;margin:90px auto;padding:60px 24px;text-align:center}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,18,35,.58);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(720px,100%);max-height:min(90vh,850px);overflow:auto;border-radius:22px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}.modal-head h2{margin:0;font-size:22px;letter-spacing:-.035em}.close{border:0;background:#f1f4f8;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:#52627a}.form{padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#46566d}.field input,.field textarea,.field select{width:100%;height:48px;border:1px solid #dbe2eb;border-radius:12px;background:#fff;padding:0 14px;font:500 14px Manrope;color:var(--ink);outline:none}.field textarea{height:auto;min-height:112px;padding:13px 14px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,34,.1)}.form-note{padding:12px 14px;border-radius:12px;background:var(--soft);color:#738198;font-size:12px;line-height:1.6}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{border:1px solid #dce3ec;background:#fff;color:#46566d;border-radius:12px;padding:12px 18px;font:800 13px Manrope;cursor:pointer}.success{padding:42px 26px;text-align:center}.success .check{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;border-radius:50%;background:var(--green);color:#148653;font-size:28px}.success h3{margin:0 0 8px;font-size:25px}.success p{color:#738198;line-height:1.7;margin:0}.mobile-apply{display:none}.mini-footer{padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#8290a3;font-size:12px}.mini-footer a{color:inherit}
@media(max-width:900px){.sub-nav{height:68px;grid-template-columns:1fr auto;padding:0 20px}.sub-nav nav{display:none}.brand img{width:126px}.header-role-btn{min-height:42px;padding:0 15px;font-size:12px}.job-shell{padding:18px 16px 112px}.job-breadcrumb{margin:0 2px 15px;font-size:12px;white-space:nowrap;overflow:hidden}.job-hero{grid-template-columns:1fr}.hero-main{padding:30px 22px;border-radius:22px}.hero-main h1{font-size:36px;line-height:1.06;margin:14px 0 20px}.hero-meta{gap:7px}.hero-meta span{min-height:36px;padding:0 10px;font-size:11.5px}.hero-side{display:none}.detail-layout{display:block;padding:40px 2px 30px}.content article{max-width:none}.content h2{font-size:24px;margin-bottom:15px}.content h2:not(:first-child){margin-top:42px}.rich-job-content,.content-list li{font-size:15px;line-height:1.78}.job-sidebar{display:none}.mobile-apply{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;padding:6px;border:1px solid #d5dde7;border-radius:17px;background:rgba(255,255,255,.96);box-shadow:0 16px 45px rgba(16,34,61,.18);backdrop-filter:blur(12px)}.mobile-apply .apply-btn{min-height:54px;border-radius:13px}.mini-footer{display:block;padding-bottom:96px}.mini-footer a{display:block;margin-top:8px}.modal{padding:0;align-items:flex-end}.modal-card{width:100%;max-height:94vh;border-radius:22px 22px 0 0}.modal-head{padding:18px}.form{padding:18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}}
@media(max-width:520px){.sub-nav{padding:0 16px}.brand img{width:116px}.header-role-btn{padding:0 13px}.hero-main{padding:28px 20px}.hero-main h1{font-size:34px}.job-meta span{font-size:11px}.job-shell{padding-left:14px;padding-right:14px}}
</style></head>
<body><div class="grain"></div>
<header class="sub-nav"><a href="/" class="brand"><img src="assets/orrica-edge-logo.png" alt="Orrica Edge"/></a><nav><a href="/">Home</a><a href="/jobs" class="active">Open roles</a></nav><a class="header-role-btn" href="/jobs">All open roles <span aria-hidden="true">↗</span></a></header>
<main id="job"></main><div class="mobile-apply" id="mobileApply" hidden><button class="apply-btn" id="mobileApplyBtn">Apply for this role <span aria-hidden="true">→</span></button></div>
<footer class="mini-footer"><span>© 2026 Orrica Edge</span><a href="/jobs">See all open roles →</a></footer>
<div class="modal" id="applyModal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="applyTitle"><div class="modal-head"><div><div class="eyebrow">Orrica Edge · Application</div><h2 id="applyTitle">Apply for this role</h2></div><button class="close" id="closeApply" aria-label="Close">×</button></div><div id="applyBody"></div></div></div>
<script src="job.js"></script></body></html>
